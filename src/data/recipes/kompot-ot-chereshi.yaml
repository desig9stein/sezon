title: Компот от череши
summary: Компот от череши с костилките, наредени в буркани и залети с горещ захарен сироп, после стерилизирани 25 минути във водна баня.
category: compote
produce: [chereshi]
yield: от 450 г череши
prepMinutes: 20
cookMinutes: 5
processingMinutes: 25
ingredients:
  - { name: Череши, quantity: 450, unit: g }
  - { name: Вода, quantity: 2.5, unit: l }
  - { name: Захар, quantity: 180, unit: g }
steps:
  - Махни дръжките на черешите и ги измий.
  - Набоди всяка череша с чиста игла от двете срещуположни страни, за да не се напука.
  - Подреди черешите в бурканите до около една трета от височината им.
  - Свари водата със захарта, докато захарта се разтвори.
  - Налей горещия сироп в бурканите, като оставиш 1,3 см празно до ръба. Избърши ръба и затвори капаците.
  - Вари бурканите 25 минути във вряща водна баня до 300 м надморска височина.
safety:
  note: 'Сиропът пази вкуса, цвета и формата на черешите, но не ги пази от разваляне – това прави варенето във водна баня. Времето във водна баня идва от NCHFP: статията, на която е основана рецептата, само затваря бурканите. Не опитвай компот от буркан с издут или отворен капак.'
  sterilisation: 'Сурово пълнене, вряща водна баня. Буркани до 470 мл и до 950 мл: 25 минути до 300 м надморска височина, 30 минути от 300 до 900 м и 35 минути от 900 до 1800 м. За по-големи буркани няма проверено време. Бурканите не е нужно да се стерилизират предварително, защото се варят 10 минути или повече.'
  storage: 'Пази затворените буркани на чисто, хладно, тъмно и сухо място, най-добре при 10–21 °C, никога над 35 °C, и ги използвай до година. Ако буркан не се е затворил херметично, дръж го в хладилник и изяж компота до седмица.'
