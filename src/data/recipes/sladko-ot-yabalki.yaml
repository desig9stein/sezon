title: Сладко от ябълки
summary: Ябълково сладко от равни части ябълки и захар, нарязани на кубчета или настъргани и сварени около 30 минути с малко вода.
category: preserve
produce: [yabalki]
yield: от 1 кг ябълки
cookMinutes: 30
processingMinutes: 5
ingredients:
  - { name: Ябълки, quantity: 1, unit: kg }
  - { name: Захар, quantity: 1, unit: kg }
  - { name: Вода, quantity: 250, unit: ml }
steps:
  - Избери ябълки от твърд сорт, измий ги, обели ги и изрежи сърцевината.
  - Нарежи ги на малки кубчета или ги настържи на едро ренде.
  - Сложи ябълките в тенджера, добави захарта и ги залей с водата.
  - Остави сместа да заври, като бъркаш непрекъснато.
  - Намали огъня и вари още около 30 минути, като не спираш да бъркаш.
  - Напълни горещото сладко в горещи стерилизирани буркани до 470 мл, като оставиш 6 мм празно до ръба. Избърши ръба и затвори капачките.
  - Вари бурканите 5 минути във вряща водна баня от момента, в който водата заври, до 300 м надморска височина.
safety:
  note: 'Не намалявай захарта, защото тя пази сладкото от мухъл и дрожди, и не заливай бурканите с парафин или восък. Варенето на напълнените буркани във водна баня го няма в статията, на която е основана рецептата; времената са от рецептата на NCHFP за ябълково сладко.'
  sterilisation: 'Стерилизирай празните буркани, като ги вариш 10 минути във вряща вода до 300 м надморска височина и по 1 минута повече за всеки следващи 300 м. Пълни само буркани до 470 мл; за по-големи няма проверено време. Напълнените буркани вари във вряща водна баня 5 минути до 300 м, 10 минути от 300 до 1800 м и 15 минути над 1800 м.'
  storage: 'Пази бурканите на хладно, тъмно и сухо място, най-добре при 10–21 °C, и ги изяж до година. Отвореното сладко дръж в хладилник и го изяж до месец. Ако по сладкото има мухъл, изхвърли целия буркан.'
