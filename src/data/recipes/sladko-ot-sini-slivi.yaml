title: Сладко от сини сливи
summary: Сладко от сини сливи на половинки, сварено на три пъти в захарен сироп с изстиване между варенията, за да останат парчетата цели.
category: preserve
produce: [slivi]
yield: от 1 кг сини сливи
prepMinutes: 20
cookMinutes: 55
processingMinutes: 5
ingredients:
  - { name: Сини сливи, quantity: 1, unit: kg }
  - { name: Захар, quantity: 1, unit: kg }
  - { name: Вода, quantity: 250, unit: ml }
steps:
  - Изплакни добре сливите, разрежи ги на половинки и махни костилките. Можеш да ги нарежеш и на по-малки парчета.
  - Смеси захарта с водата в тенджера и бъркай на огъня, докато захарта се разтвори напълно.
  - Сложи сливите в сиропа, остави ги да заврят и намали огъня. Вари ги 15–20 минути и обирай пяната.
  - Свали сладкото от огъня и го остави да изстине 1,5–2 часа.
  - Вари го отново около 15 минути на слаб огън и пак го остави да изстине.
  - Вари го за трети път около 20 минути.
  - Напълни горещото сладко в горещи стерилизирани буркани, като оставиш 6 мм празно до ръба. Избърши ръба и затвори капаците.
  - Вари бурканите 5 минути във вряща водна баня до 300 м надморска височина.
safety:
  note: 'Не намалявай захарта, защото тя пази сладкото от мухъл и дрожди, и не заливай бурканите с парафин или восък. Варенето на напълнените буркани във водна баня го няма в статията, на която е основана рецептата; то идва от NCHFP и пази сладкото от мухъл.'
  sterilisation: 'Стерилизирай празните буркани, като ги вариш 10 минути във вряща вода до 300 м надморска височина и по 1 минута повече за всеки следващи 300 м. Напълнените буркани вари 5 минути във вряща водна баня и добавяй по 1 минута за всеки 300 м надморска височина. Ако бурканите не са стерилизирани, вари напълнените 10 минути.'
  storage: 'Пази бурканите на хладно, тъмно и сухо място, най-добре при 10–21 °C, и ги изяж до година. Отвореното сладко дръж в хладилник и го изяж до месец. Ако по сладкото има мухъл, изхвърли целия буркан.'
