title: Сладко от дюли
summary: Сладко от наситнени дюли, сварени в захарен сироп с малко лимонена киселина и затворени горещи в стерилизирани буркани.
category: preserve
produce: [dyuli]
yield: около 3 бурканчета
prepMinutes: 30
cookMinutes: 60
processingMinutes: 5
ingredients:
  - { name: Дюли, quantity: 1, unit: kg }
  - { name: Захар, quantity: 800, unit: g }
  - { name: Вода, quantity: 800, unit: ml }
  - { name: Лимонена киселина, quantity: 0.25, unit: tsp }
steps:
  - Измий дюлите, обели ги и изрежи семките.
  - Наситни ги в блендер на кратки импулси от 2–3 секунди, за да останат малки парченца.
  - Сложи захарта във водата и я остави да заври.
  - Изсипи дюлите във врящия сироп и ги вари на слаб огън, като разбъркваш от време на време, докато сладкото се сгъсти.
  - Разтвори лимонената киселина в няколко капки вода, излей я в сладкото, разбъркай и свали тенджерата от огъня.
  - Напълни горещото сладко в горещи стерилизирани буркани, като оставиш 6 мм празно до ръба. Избърши ръба и затвори капаците.
  - Вари бурканите 5 минути във вряща водна баня до 300 м надморска височина.
safety:
  note: 'Дюлите са достатъчно кисели за варене във водна баня, когато плодът е сварен напълно преди пълненето. Не намалявай захарта, защото тя пази сладкото от мухъл и дрожди, и не заливай бурканите с парафин или восък. Варенето на напълнените буркани във водна баня го няма в рецептата, на която е основано сладкото; то идва от източниците за безопасност.'
  sterilisation: 'Стерилизирай празните буркани, като ги вариш 10 минути във вряща вода до 300 м надморска височина и по 1 минута повече за всеки следващи 300 м. Напълнените буркани вари 5 минути във вряща водна баня и добавяй по 1 минута за всеки 300 м надморска височина. Ако бурканите не са стерилизирани, вари напълнените 10 минути.'
  storage: 'Пази бурканите на хладно, тъмно и сухо място, най-добре при 10–21 °C, и ги изяж до година. Отвореното сладко дръж в хладилник и го изяж до месец. Ако по сладкото има мухъл, изхвърли целия буркан.'
