title: Кисело зеле
summary: 'Нарязано кисело зеле само от зеле и сол: ферментира 3–4 седмици, после се пази в хладилник или се стерилизира в буркани.'
category: sauerkraut
produce: [zele]
yield: около 1,7 л
prepMinutes: 45
cookMinutes: 10
processingMinutes: 15
waitDays: 21
ingredients:
  - { name: Бяло зеле, quantity: 2.3, unit: kg }
  - { name: Сол за консервиране, quantity: 3, unit: tbsp }
steps:
  - Избери плътни глави бяло зеле от зимен сорт и започни до 1–2 дни след берането.
  - Махни външните листа, измий зелките под студена течаща вода и ги остави да се отцедят.
  - Разрежи всяка зелка на четири, изрежи кочана и нарежи зелето на тънки ленти, колкото дебелината на монета.
  - Сложи зелето в чист съд за ферментация – стъклен буркан или емайлиран съд, но не алуминиев. Поръси го със солта и го разбъркай добре с чисти ръце.
  - Натъпчи го плътно, докато солта извади сока, и остави 10–13 см свободни до ръба на съда.
  - 'Ако сокът не покрива зелето, долей сварена и охладена саламура: 1½ с.л. сол на 950 мл вода.'
  - Притисни зелето с чиния и тежест, така че да остане под сока, и покрий съда с чиста кърпа.
  - Остави го да ферментира при 21–24 °C. Зелето е готово след 3–4 седмици, когато спре да прави мехурчета; при 16–18 °C отнема 5–6 седмици.
  - Ако притискаш с буркани с вода, проверявай зелето 2–3 пъти седмично и обирай ципата, ако се появи.
  - Готовото зеле прибери плътно покрито в хладилник или го стерилизирай по следващите две стъпки.
  - Загрей зелето със сока до кипване, като разбъркваш често. Напълни бурканите плътно със зеле и сок, остави 1,3 см празно до ръба и затвори капаците.
  - 'Вари бурканите във вряща водна баня: 10 минути за буркани до 470 мл и 15 минути за буркани до 950 мл, до 300 м надморска височина.'
safety:
  note: 'Солта е важна за безопасността на ферментиралото зеле: не я намалявай и не използвай сол с намалено съдържание на натрий. Количеството сол, ферментацията и стерилизацията следват NCHFP, а не статията, на която е основана рецептата: там солта е по-малко, ферментацията е 3 дни, а бурканите се стерилизират при 80 °C. Под 16 °C зелето може да не ферментира, а над 24 °C омеква.'
  sterilisation: 'Горещо пълнене, вряща водна баня. Буркани до 470 мл: 10 минути до 300 м надморска височина и 15 минути от 300 до 1800 м. Буркани до 950 мл: 15 минути до 300 м и 20 минути от 300 до 1800 м. За по-големи буркани няма проверено време. Бурканите не е нужно да се стерилизират предварително, защото се варят 10 минути или повече.'
  storage: 'Ферментиралото зеле се пази плътно покрито в хладилник няколко месеца. Стерилизираните буркани пази на чисто, хладно, тъмно и сухо място, най-добре при 10–21 °C, никога над 35 °C, и ги използвай до година.'
