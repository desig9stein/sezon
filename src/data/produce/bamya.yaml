  tips:
    - 'Сей във втората половина на май, когато почвата на 10 см дълбочина се стопли до 18–19 °C.'
    - 'Подходяща е леха след ранни зеленчуци като спанак, лук, репички или салати.'
    - 'В малка градина сей в гнезда през 35–40 см, с 60–70 см между редовете, по 3–4 семена на 4–5 см дълбочина.'
    - 'Поливай редовно: бамята иска най-много влага в началото и докато цъфти и връзва плодове.'
    - 'Бери плодовете при дължина 4–5 см, преди да загрубеят; бамята плододава до първите есенни слани.'
