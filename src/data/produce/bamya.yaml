preparation:
  - method: В яхния или гювеч
    tip: Сложи бамята цяла или нарязана в яхния или гювеч.
  - method: Туршия
    tip: Малките чушки на бамята стават и за туршия.
traditionalUses: []
howToChoose: Избери малки, крехки чушки, дълги около 4–5 см; по-големите загрубяват.
storage: Приготви бамята до 2–3 дни след брането, защото бързо завяхва; дотогава я пази в хладилника.
faq:
  - question: Кога е сезонът на бамята?
    answer: Бамята влиза в плододаване около два месеца след сеитбата през втората половина на май и плододава до първите есенни слани.
  - question: Къде се отглежда бамята в България?
    answer: Предимно в южните райони на страната. Официални данни по области за нея няма.
