preparation:
  - method: Сурови
    tip: Младите тиквички може да ядеш и сурови, нарязани на тънко в салата.
  - method: Задушени или печени
    tip: Готви ги кратко, за да не се разкашкат; кората на младите тиквички не се бели.
traditionalUses: []
howToChoose: Избери малки до средни, твърди и лъскави тиквички с гладка кора; прекалено големите са по-груби и с едри семки.
storage: Пази ги в хладилника и ги изяж до няколко дни. Може да ги замразиш и после да ги сложиш в крем супа или гювеч.
faq:
  - question: Кога е сезонът на тиквичките?
    answer: При ранна сеитба под покритие първите беритби започват в края на април и продължават до края на септември.
  - question: Има ли български сортове тиквички?
    answer: Да, в Официалната сортова листа са вписани например Бистра и Изобилна.
