name: Тиквички
latinName: Cucurbita pepo
kind: vegetable
group: tikvovi
summary: Тиквичките растат бързо и при ранна сеитба се берат от края на април до края на септември. Имат около 17 kcal на 100 г.
varieties:
  - name: Бистра
  - name: Изобилна
