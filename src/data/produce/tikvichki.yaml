  transplant: []
  plant: []
  plantingNote: 'За ранна реколта сей през март в съоръжения; на открито сей директно през април, май и до юни, според района.'
  tips:
    - 'Сей, когато почвата трайно се затопли и мине опасността от късни пролетни мразове.'
    - 'Подходяща е леха, в която миналата година са расли домати, пипер или бобови култури.'
    - 'Сей по 4–5 семена в гнездо на 3–4 см дълбочина и след поникването остави по едно растение.'
    - 'Остави 80–90 см между редовете и 60 см между растенията в реда.'
    - 'Бери редовно, понякога всеки ден: прекалено големите тиквички загрубяват.'
