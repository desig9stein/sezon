growing:
  sow: []
  transplant: []
  plant: [9, 10]
  plantingNote: 'Орехът се засажда наесен – от края на септември до края на октомври; ноември не е подходящ за него.'
  tips:
    - 'Засади присадено дръвче – ражда след 3–5 години, а орех от семе – едва след 10–15.'
    - 'Орехът иска много светлина и дълбока, пропусклива почва без високи подпочвени води.'
    - 'Короната става 15–20 м – засади го в северната част на двора и далеч от оградата на съседа.'
    - 'Орехът е сравнително сухоустойчив, но поливането след цъфтежа и през лятото подобрява ядките.'
    - 'Бери през септември–октомври; най-добре изчакай орехите да паднат сами.'
