    tip: Суровите орехи запазват полиненаситените мазнини, които се окисляват при силно печене.
  - method: Накиснати
    tip: Накисването за няколко часа ги прави по-меки и по-лесни за смилане.
traditionalUses: []
howToChoose: Изберете тежки орехи с цяла черупка, без пукнатини и мухъл; ядката трябва да е светла.
storage: С черупка – на сухо и хладно място до година; обелени – в хладилник или фризер, защото гранясват.
faq:
  - question: Колко ореха на ден е разумно да се ядат?
    answer: Шепа орехи (около 30 г) е обичайна порция; те са калорични – около 650 kcal на 100 г.
