name: Глухарче
latinName: Taraxacum officinale
kind: vegetable
group: slozhnotsvetni
summary: 'Листата на глухарчето се берат напролет, преди растението да цъфне през април и май. Пресните листа стават за салата.'
wild: true
season:
  - { month: 3, level: available }
  - { month: 4, level: available }
cautions:
  - kind: protected
    text: 'Глухарчето е в списъка на Закона за лечебните растения: за лични нужди можеш да набереш до 1 кг листа и до 0,5 кг цветове на ден, а за търговия ти трябва позволително.'
    source:
      name: 'Закон за лечебните растения (обн. ДВ, бр. 29 от 2000 г., посл. изм. ДВ, бр. 58 от 2017 г.), копие във FAOLEX'
      url: https://faolex.fao.org/docs/pdf/bul40297.pdf
