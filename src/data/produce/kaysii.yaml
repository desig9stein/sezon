growing:
  sow: []
  transplant: []
  plant: [3, 11, 12]
  plantingNote: 'Наесен засаждай от ноември до 15–20 декември, преди големите студове; напролет – в началото на март.'
  tips:
    - 'Кайсията се развива добре до около 600 м надморска височина.'
    - 'Тя е сред най-податливите на зимни повреди овошки – избягвай ниски места и котловини, където се задържа студен въздух.'
    - 'Цъфти рано и късните пролетни студове могат да повредят цвета – където ги има, избирай сорта особено внимателно.'
    - 'Може да расте и на слабо алкална почва.'
    - 'Роксана е самофертилен сорт, а Харкот – частично самофертилен.'
