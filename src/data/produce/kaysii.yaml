  fiberG: 2
  sugarsG: 9.24
  micronutrients:
    - { nutrient: vitamin-a, amount: 96 }
    - { nutrient: vitamin-c, amount: 10 }
    - { nutrient: kaliy, amount: 259 }
  source:
    name: 'USDA FoodData Central, SR Legacy: Apricots, raw'
    url: https://fdc.nal.usda.gov/food-details/171697/nutrients
preparation:
  - method: Пресни
    tip: Яж ги с кората – само ги измий добре.
  - method: Сушени
    tip: Сушените кайсии са по-сладки и с повече калории на 100 г, защото водата в тях е изпарена.
traditionalUses: []
howToChoose: Избери ароматни, наситено оранжеви кайсии, които поддават леко при натиск.
storage: Твърдите кайсии дозряват на стайна температура; узрелите пази в хладилник и ги изяж до няколко дни.
faq:
  - question: Кога е сезонът на кайсиите в България?
    answer: Ранните сортове узряват през втората половина на юни, повечето – през юли, а някои късни сортове – в началото на август.
updatedAt: 2026-11-13
