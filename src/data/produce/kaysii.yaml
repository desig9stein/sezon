name: Кайсии
latinName: Prunus armeniaca
kind: fruit
group: rozotsvetni
summary: Кайсиите узряват от края на юни до началото на август. Силистра е областта с най-голяма площ кайсиеви градини в страната.
varieties:
  - name: Унгарска
    note: Стар сорт, един от най-разпространените в страната.
  - name: Харкот
    note: Канадски сорт, който се развива много добре у нас.
  - name: Роксана
    note: Български сорт.
  - name: Силистренска компотна
    note: Български сорт, подходящ за преработка.
season:
  - { month: 6, level: available }
  - { month: 7, level: peak }
  - { month: 8, level: available }
regions:
  - region: silistra
    note: 'Областта с най-голяма площ с насаждения от кайсии и зарзали в страната – 2 151 ха към 2023 г.'
    source:
      name: 'МЗХ, Агростатистика – Структура на основни овощни видове в България през 2023 г. (предварителни резултати), бюлетин № 448'
      url: https://www.mzh.government.bg/media/filer_public/2025/01/17/ra448_publicationstructureorchard2023-preliminaryresults.pdf
  - region: ruse
    note: 'Областта с втората по големина площ с насаждения от кайсии и зарзали – 273 ха към 2023 г.'
    source:
      name: 'МЗХ, Агростатистика – Структура на основни овощни видове в България през 2023 г. (предварителни резултати), бюлетин № 448'
      url: https://www.mzh.government.bg/media/filer_public/2025/01/17/ra448_publicationstructureorchard2023-preliminaryresults.pdf
  - region: dobrich
    note: 'Областта с третата по големина площ с насаждения от кайсии и зарзали – 140 ха към 2023 г.'
    source:
      name: 'МЗХ, Агростатистика – Структура на основни овощни видове в България през 2023 г. (предварителни резултати), бюлетин № 448'
      url: https://www.mzh.government.bg/media/filer_public/2025/01/17/ra448_publicationstructureorchard2023-preliminaryresults.pdf
