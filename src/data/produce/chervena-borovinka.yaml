name: Червена боровинка
latinName: Vaccinium vitis-idaea
kind: fruit
group: pirenovi
summary: 'Червената боровинка е вечнозелено храстче по каменисти поляни и в иглолистни гори от 1000 до 2000 м. Плодовете се берат през август.'
wild: true
season:
  - { month: 8, level: peak }
cautions:
  - kind: protected
    text: 'Червената боровинка е в списъка на Закона за лечебните растения: за лични нужди можеш да набереш до 10 кг плодове на ден, а за търговия ти трябва позволително.'
    source:
      name: 'Закон за лечебните растения (консолидиран текст до ДВ, бр. 58 от 2017 г.), копие във FAOLEX'
      url: https://faolex.fao.org/docs/pdf/bul40297.pdf
updatedAt: 2026-11-13
