growing:
  sow: []
  transplant: []
  plant: [3, 4, 9, 10]
  plantingNote: 'Засаждай напролет (март–април) или наесен (септември–октомври); при поливане може и през лятото.'
  tips:
    - 'Избери място, защитено от ветрове, с добре дренирана, слабо кисела почва; избягвай много тежките и варовитите почви.'
    - 'При мулчиране със слама засаждай на 25 см в реда и на 80 см между редовете.'
    - 'Полей задължително след засаждането и до 15–20 дни подсади растенията, които не са се прихванали.'
    - 'Най-много вода ягодите искат напролет, когато растат листата и се оформят плодовете.'
    - 'Засади няколко сорта с различен срок на узряване, за да береш по-дълго.'
  sources:
    - name: 'Български фермер – Есенното засаждане на ягоди се прави със свеж разсад'
      url: https://www.bgfermer.bg/Article/6502522
