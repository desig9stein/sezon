name: Ягоди
latinName: Fragaria × ananassa
kind: fruit
group: rozotsvetni
summary: Ягодите от открити площи се берат през май и юни. Сочни и ароматни, те са най-вкусни пресни, скоро след беритбата.
varieties:
  - name: Клери
    note: Италиански много ранен сорт за прясна консумация.
  - name: Антея
  - name: Елсанта
