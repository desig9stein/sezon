preparation:
  - method: Пресни
    tip: Измий ги, преди да махнеш чашките, за да не поемат вода, и ги яж скоро след това.
  - method: Замразени
    tip: Замрази ги цели върху поднос и после ги прибери в торбичка – така не се слепват.
traditionalUses: []
howToChoose: Избери лъскави, изцяло червени ягоди със свежи зелени чашки, без меки или мухлясали места.
storage: Пази ги неизмити в хладилник и ги изяж до два-три дни.
faq:
  - question: Кога е сезонът на ягодите в България?
    answer: Ягодите от открити площи се берат главно през май и юни.
  - question: Защо да не мия ягодите предварително?
    answer: Водата ги размеква и те мухлясват по-бързо – мий ги точно преди ядене.
