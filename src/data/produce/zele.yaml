growing:
  sow: [2, 4, 6]
  transplant: [3, 4, 5, 6, 7]
  plant: []
  plantingNote: 'Ранното зеле се сее в парник през февруари и се разсажда в края на март – началото на април; средноранното се сее през април и се разсажда в края на май – началото на юни; късното – в средата на юни и в средата на юли.'
  tips:
    - 'Засаждай разсада, без да покриваш с пръст връхчето в средата на растението.'
    - 'Зелето пие много вода – поливай при засаждането, след 5–6 дни и после редовно всяка седмица.'
    - 'Окопавай редовно и леко загърляй младите растения, за да образуват допълнителни корени.'
    - 'Засади до зелето копър, моркови или магданоз – помагат срещу молците и зелевите пеперуди.'
    - 'Остави 60 × 40 см за ранното и 70 × 45 см за средноранното зеле; късното прибери навреме наесен.'
  sources:
    - name: 'Gradinata.bg – Зелето - дебеланкото космополит'
      url: https://www.gradinata.bg/index.php?page=article&article_id=238
    - name: 'Agrozona.bg – Сложете до зелето магданоз, невенът пази от кореново гниене'
      url: https://agrozona.bg/slozhete-do-zeleto-magdanoz-nevenat-pazi-ot-korenovo-gniene/
