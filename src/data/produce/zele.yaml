name: Зеле
latinName: Brassica oleracea var. capitata
kind: vegetable
group: krastotsvetni
summary: Есенното зеле е най-хрупкаво и сладко. Богато е на витамин C и K, съхранява се дълго и е основа на туршиите и киселото зеле.
varieties:
  - name: Бяло зеле
  - name: Червено зеле
    note: Съдържа антоцианини, които му придават лилавия цвят.
  - name: Савойско зеле
    note: С нагънати листа и по-нежна текстура.
