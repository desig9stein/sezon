preparation:
  - method: Сурово
    tip: Нарязано на салата непосредствено преди сервиране запазва най-много витамин C.
  - method: Задушено
    tip: Кратко задушаване с малко вода губи по-малко водоразтворими витамини от варенето.
  - method: Кисело зеле
    tip: Ферментацията запазва голяма част от витамин C и добавя млечнокисели бактерии.
traditionalUses:
  - system: folk
    use: Традиционно се използва в българската народна медицина под формата на компреси от зелеви листа.
    source:
      name: 'Wikipedia: Cabbage'
      url: https://en.wikipedia.org/wiki/Cabbage
howToChoose: Изберете плътна и тежка за размера си глава с лъскави, плътно прилепнали листа без петна.
storage: Цяла глава се пази в хладилник до две седмици; нарязаното зеле е най-добре да се изяде до два дни.
faq:
  - question: Кога е сезонът на зелето в България?
    answer: Най-доброто зеле е от септември до ноември. През зимата се предлага от хранилища.
  - question: Какви хранителни вещества съдържа зелето?
    answer: Съдържа витамин C и витамин K, фибри и малко калории – около 25 kcal на 100 г.
