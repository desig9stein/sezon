growing:
  sow: [1, 2, 4]
  transplant: [5, 6]
  plant: []
  plantingNote: 'Разсада за ранен патладжан сей от края на януари до средата на февруари, за късен – през април; засаждай навън след втората половина на май и до юни.'
  tips:
    - 'Засаждай, когато почвата трайно се задържи над 13–14 °C; в студена почва растенията са потиснати.'
    - 'Сади разсада във фаза 4–5 лист, на 70 см между редовете и 40 см между растенията.'
    - 'Не сади патладжан след домати, пипер или картофи; добре расте след бобови, тикви, дини и пъпеши.'
    - 'Подхрани с минерален тор около 20 дни след засаждането, а после – на всеки две седмици.'
    - 'Бери редовно готовите плодове, за да узряват по-бързо останалите.'
