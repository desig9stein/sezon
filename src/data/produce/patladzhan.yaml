preparation:
  - method: Печен
    tip: Изпечи го цял до омекване, обели го и го използвай за кьопоолу или салата.
  - method: Задушен
    tip: Нарязан на кубчета и задушен с домати и лук поема по-малко мазнина, отколкото пържен.
traditionalUses: []
howToChoose: Избери лъскав, тежък за размера си патладжан с опъната кора и свежа зелена чашка, без меки петна.
storage: Пази го на хладно място или в хладилника и го изяж до няколко дни; не го мий преди съхранение.
faq:
  - question: Кога е сезонът на патладжана?
    answer: Патладжанът се засажда навън едва при трайно затопляне, обикновено след втората половина на май, затова от открити площи се бере от юли до октомври.
  - question: Има ли български сортове патладжан?
    answer: Да, в Официалната сортова листа е вписан сортът Български 12.
