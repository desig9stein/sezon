preparation:
  - method: Сурова в салата
    tip: Късай листата и подправяй салатата непосредствено преди сервиране, за да останат хрупкави.
  - method: С външните листа
    tip: Не изхвърляй външните тъмнозелени листа – в тях има повече каротин и витамин C, отколкото във вътрешните.
traditionalUses: []
howToChoose: Избери стегната глава с хрупкави, свежи листа без кафяви ръбове и слуз.
storage: Неизмита маруля пази в хладилник, увита във влажна кърпа, до пет дни.
faq:
  - question: Кога е сезонът на марулята?
    answer: Пролетната маруля е от март до юни, а есенната – от октомври до ноември. През лятото листата загрубяват и горчат.
