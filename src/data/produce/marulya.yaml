  plant: []
  plantingNote: 'Разсада за пролетна маруля сей около 15–20 януари в полутопъл парник или оранжерия.'
  tips:
    - 'Засаждай пролетната маруля на по-лека почва, която се затопля по-лесно.'
    - 'Разсаждай през 30 см между редовете и 25–30 см в реда.'
    - 'Засаждай на същата дълбочина като в разсадната леха, без да заравяш растежния връх.'
    - 'Подхрани с амониева селитра, след като растенията се прихванат и пуснат нови листа.'
    - 'Зимните сортове сей през септември, за да поникнат и да се вкоренят преди зимата.'
