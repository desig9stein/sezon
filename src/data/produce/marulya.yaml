name: Маруля
latinName: Lactuca sativa var. longifolia
kind: vegetable
group: slozhnotsvetni
summary: Марулята е най-хрупкава напролет и наесен – през лятото листата ѝ загрубяват. Има високо съдържание на витамин K, витамин A и фолат.
varieties:
