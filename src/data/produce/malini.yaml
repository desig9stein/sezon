name: Малини
latinName: Rubus idaeus
kind: fruit
group: rozotsvetni
summary: Малините зреят от края на юни, а ремонтантните сортове дават втора реколта от средата на август до началото на октомври.
varieties:
  - name: Люлин
    note: 'Български ремонтантен сорт – плододава два пъти в годината; узрява в края на август и началото на септември.'
  - name: Херитидж
    note: 'Втората реколта зрее от 15–20 август, а при топла есен се бере до 5–10 октомври.'
season:
  - { month: 6, level: available }
