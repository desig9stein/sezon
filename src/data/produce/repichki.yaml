preparation:
  - method: Сурови
    tip: Яж ги сурови и нарязани непосредствено преди сервиране – така запазват витамин C и хрупкавостта си.
traditionalUses: []
howToChoose: Избери твърди, гладки и ярко оцветени репички със свежи листа; меките и напуканите са презрели.
storage: Отрежи листата и пази репичките в хладилник в плик до седмица.
faq:
  - question: Защо репичките понякога са горчиви и меки?
    answer: Най-често заради сухата почва – без достатъчно влага репичките стават горчиви и меки.
