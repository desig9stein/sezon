growing:
  sow: [3, 8]
  transplant: []
  plant: []
  plantingNote: 'Ранните сортове сей напролет, а късните – не по-рано от август.'
  tips:
    - 'Сей на открито, слънчево и защитено от вятър място – репичките не понасят засенчване.'
    - 'Не внасяй оборски тор – при много азот в средата на корена се образуват кухини.'
    - 'Сей в бразди на 2–3 см дълбочина и 10–15 см една от друга, със семе на всеки 5 см.'
    - 'Поддържай почвата умерено влажна – без достатъчно влага репичките стават горчиви и меки.'
    - 'Прореди гъстия посев – между две растения трябва да има поне 3 см.'
