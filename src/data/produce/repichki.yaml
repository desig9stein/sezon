name: Репички
latinName: Raphanus sativus
kind: vegetable
group: krastotsvetni
summary: Репичките са сред първите пролетни зеленчуци и имат втори сезон наесен. Хрупкави и леко люти, те са източник на витамин C.
varieties:
  - name: Едри червени
  - name: Любими
