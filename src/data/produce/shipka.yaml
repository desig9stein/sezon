name: Шипка
latinName: Rosa canina
kind: fruit
group: rozotsvetni
summary: Шипките се берат от септември до първите слани, преди да омекнат. Най-много култивирани шипки се берат в Южния централен район.
season:
  - { month: 9, level: peak }
regions:
  - region: plovdiv
    note: 'Областта е в Южния централен район, който има най-голямата реколтирана площ с култивирани шипки сред районите в страната – 323 от 950 ха през 2025 г.'
