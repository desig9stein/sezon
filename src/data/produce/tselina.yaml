  - { month: 9, level: available }
  - { month: 10, level: peak }
  - { month: 11, level: peak }
  - { month: 12, level: available }
  - { month: 1, level: storage }
  - { month: 2, level: storage }
regions:
  - region: plovdiv
    note: Целината изисква влага и плодородна почва, каквито има в Тракийската низина.
