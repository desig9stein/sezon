preparation:
  - method: В супа
    tip: Варете я в супата и консумирайте и бульона, в който остават минералите.
  - method: Сурова салата
    tip: Настъргана сурова с лимонов сок запазва витамин C и не потъмнява.
traditionalUses: []
howToChoose: Изберете тежък, твърд корен без кухини; по-малките корени са по-нежни.
storage: Цял корен се пази в хладилник до три седмици.
faq:
  - question: Как се почиства кореновата целина?
    answer: Обелете дебелата кора с нож и веднага поставете нарязаната целина във вода с лимон, за да не потъмнее.
