name: Целина
latinName: Apium graveolens var. rapaceum
kind: vegetable
group: sennikotsvetni
summary: Целината (кореновата) е в разгара си през октомври и ноември. С ароматния си вкус е основа на есенните супи и яхнии.
varieties:
  - name: Коренова целина
