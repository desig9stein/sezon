preparation:
  - method: В супа
    tip: Вари я в супата и консумирай и бульона, в който остават минералите.
  - method: Сурова салата
    tip: Настъргана сурова с лимонов сок запазва витамин C и не потъмнява.
traditionalUses: []
howToChoose: Избери тежък, твърд корен без кухини; по-малките корени са по-нежни.
storage: Цял корен се пази в хладилник до три седмици.
faq:
  - question: Как се почиства кореновата целина?
    answer: Обели дебелата кора с нож и веднага постави нарязаната целина във вода с лимон, за да не потъмнее.
