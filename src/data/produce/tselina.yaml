  plant: []
  tips:
    - 'Целината иска дълбока, хумусна и влагозадържаща почва; избягвай леки песъчливи и студени глинести.'
    - 'Не тори с пресен оборски тор и не я връщай на същото място по-рано от 3–4 години.'
    - 'Разсаждай растения с 4–5 листа, без да затрупваш връхната пъпка; кореноплодната – на 25–30 см в реда.'
    - 'Поливай редовно и не допускай засушаване – целината се отглежда само с поливане.'
    - 'Не бързай с прибирането – целината расте най-добре в хладните есенни дни.'
