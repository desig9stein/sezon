growing:
  sow: [3]
  transplant: [6]
  plant: []
  tips:
    - 'Целината е взискателна към почвата и хранителните вещества – подготви добре лехата.'
    - 'Не тори с пресен оборски тор; ако трябва, внеси го наесен с дълбоката оран.'
    - 'Разсаждай растения с 6–7 листа на същата дълбочина, без да затрупваш връхчето, на около 30 см в реда.'
    - 'Поливай редовно – при ниска влажност целината забавя растежа си, а листата загрубяват.'
    - 'Не бързай с прибирането – кореноплодите на целината се вадят чак късно през есента.'
