      url: https://www.bgfermer.bg/Article/9084454
organic:
  availability: limited
  note: 'Дюлите са в малката група „други семкови“ (11 ха през 2020 г., Евростат); отглежда ги биоферма „Версол“, която посочва, че е сертифицирана.'
