growing:
  sow: []
  transplant: []
  plant: [3, 11, 12]
  plantingNote: 'Фиданките се засаждат наесен – от ноември до средата на декември – или рано напролет, през март.'
  tips:
    - 'Дюлята е топлолюбива – засади я на слънчево, равно и защитено място; над 500–600 м плодовете трудно узряват.'
    - 'Избягвай сухи, песъчливи и варовити почви – на варовита почва дървото страда от хлороза.'
    - 'Поливай особено през август и септември, когато плодовете наедряват най-бързо.'
    - 'За единично дърво избери самоопрашващ се сорт като Асеница, Пловдивска, Хемус или Тримонциум.'
    - 'Бери, когато кожицата пожълтее; съхранявай плодовете на хладно – издържат до януари.'
  sources:
