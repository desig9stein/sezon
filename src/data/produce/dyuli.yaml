preparation:
  - method: Печени
    tip: Печенето омекотява плода и запазва фибрите; не е нужно много подсладител.
  - method: Сладко и компот
    tip: Дюлите са богати на пектин и сгъстяват естествено сладката.
traditionalUses: []
howToChoose: Изберете жълти, ароматни плодове без кафяви петна; лекият мъх по кората е нормален.
storage: На хладно място дюлите издържат няколко седмици; не ги дръжте до други плодове, защото поемат аромата им.
faq:
  - question: Могат ли дюлите да се ядат сурови?
    answer: Могат, но са твърди и стипчиви. Затова най-често се пекат или се правят на сладко.
