  plant: [3, 11, 12]
  plantingNote: 'Наесен засаждай от ноември до 15–20 декември, преди големите студове; напролет – в началото на март.'
  tips:
    - 'Прасковата се развива добре до около 600 м надморска височина и на по-равни места.'
    - 'Засади я там, където можеш да поливаш – валежите у нас не стигат на прасковата.'
    - 'Тя е сред най-податливите на зимни повреди овошки – избягвай ниски места, където се задържа студен въздух.'
    - 'Цъфти рано, затова там, където има късни пролетни студове, избирай сорта особено внимателно.'
