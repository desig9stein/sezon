preparation:
  - method: Пресни
    tip: Измий ги добре и ги яж с кората или я обели, ако мъхът ти пречи.
  - method: Печени
    tip: Разрежи ги на половини, махни костилката и ги опечи за бърз десерт без добавена захар.
traditionalUses: []
howToChoose: Узрялата праскова ухае сладко и поддава леко при натиск около дръжката.
storage: Твърдите праскови дозряват на стайна температура; узрелите пази в хладилник и ги изяж до няколко дни.
faq:
  - question: Кога е сезонът на прасковите в България?
    answer: Най-ранните сортове узряват в края на юни, повечето – през юли и август, а късните – до края на септември.
