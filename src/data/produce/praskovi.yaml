name: Праскови
latinName: Prunus persica
kind: fruit
group: rozotsvetni
summary: Прасковите се берат от юни до септември, като сортовете узряват един след друг. Най-много прасковени градини има в Сливенско.
varieties:
  - name: Редхейвън
    note: Американски сорт, дълго време основен стандартен сорт у нас.
  - name: Глоухейвън
  - name: Файет
    note: Много ранен американски сорт.
  - name: Ласкава
    note: Устойчив на брашнеста мана сорт, узрява седмица след Редхейвън.
