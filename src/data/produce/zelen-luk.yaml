  transplant: []
  plant: [3, 10]
  plantingNote: 'За зелен лук рано напролет засади арпаджик наесен; пролетното засаждане е през март.'
  tips:
    - 'За зелен лук избери едрия арпаджик (балучка) – той се препоръчва за лук за пера.'
    - 'Засаждай луковичките във влажна почва, в редове през 12–15 см и през 6–7 см в реда.'
    - 'Отглеждай лука на по-леки, песъчливо-глинести почви – тежките и студени почви не са подходящи.'
    - 'Не го засаждай между овощни дръвчета – лукът обича светлината.'
    - 'Не тори с пресен оборски тор; лукът реагира добре на компост и добре разложен оборски тор.'
