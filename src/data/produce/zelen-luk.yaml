preparation:
  - method: Суров
    tip: Нарязвай го непосредствено преди сервиране – суровият лук запазва витамин C.
traditionalUses: []
howToChoose: Избери стегнати, яркозелени пера без пожълтели връхчета и с бели, твърди луковички.
storage: Увий го във влажна хартия и го пази в хладилник до пет дни.
faq:
  - question: Кога е сезонът на зеления лук?
    answer: Основно от март до май. Най-ранният зелен лук е от арпаджик, засаден наесен.
