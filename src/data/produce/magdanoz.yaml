growing:
  sow: [2, 8, 9]
  transplant: []
  plant: []
  tips:
    - 'Магданозът понася и сянка, но там ароматът на листата му намалява.'
    - 'Сей в чиста от плевели леха и плеви редовно – плевелите пречат на младите растения.'
    - 'Сей там, където си гледал торени с оборски тор ранни домати, ранни краставици или тиквички.'
    - 'Сей плитко, на 1–2 см, в браздички през 20 см.'
    - 'Режи листата, когато стигнат 12–15 см, без да изрязваш растенията твърде ниско – пазиш растежния връх.'
