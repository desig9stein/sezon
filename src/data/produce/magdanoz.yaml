growing:
  sow: [2, 8, 9]
  transplant: []
  plant: []
  tips:
    - 'Избери слънчево място – на сянка листата пожълтяват и ароматът отслабва.'
    - 'Сей в чиста от плевели почва – семената никнат бавно и лесно се задушават.'
    - 'Не тори с пресен оборски тор; подходящи предшественици са наторени окопни и бобови култури.'
    - 'Сей плитко, на 1–2 см, в редове през 15–20 см.'
    - 'Режи листата няколко пъти, без да засягаш връхчетата; последната беритба – месец преди зимата.'
