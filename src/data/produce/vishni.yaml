name: Вишни
latinName: Prunus cerasus
kind: fruit
group: rozotsvetni
summary: Вишните узряват от началото на юни до средата на юли според района и сорта. Най-много вишневи градини има в Търговище, София-област и Пловдив.
varieties:
  - name: Хайманов рубин
    note: 'Узрява от 12 до 15 юни.'
  - name: Фанал
    note: 'Узрява от 20 до 30 юни.'
  - name: Облачанска вишна
    note: 'Узрява от 1 до 6 юли.'
  - name: Монтморенси
    note: 'Узрява от 1 до 6 юли.'
  - name: Сенчеста морела
    note: 'Узрява от 5 до 12 юли.'
  - name: Метеор
    note: 'Узрява обикновено от 10 до 15 юли.'
season:
  - { month: 6, level: peak }
  - { month: 7, level: available }
