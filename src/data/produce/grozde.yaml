preparation:
  - method: Прясно
    tip: Измий гроздето точно преди ядене, като държиш грозда за чепката.
  - method: Замразено
    tip: Откъснатите и подсушени зърна замразени стават на хладна лятна хапка.
traditionalUses: []
howToChoose: Избери стегнати гроздове със здрави зърна, които се държат здраво за чепката, и зелени, не изсъхнали дръжки.
storage: Пази гроздето неизмито в хладилник и го изяж до около седмица.
faq:
  - question: Кога узрява десертното грозде?
    answer: Ранните сортове дават грозде през юли и август, средните – през август и септември, а късните продължават през есента.
  - question: Кои десертни сортове са познати у нас?
    answer: Сред познатите сортове са Болгар, Супер ран болгар, Плевен, Кардинал и Хамбургски мискет.
