name: Грозде
latinName: Vitis vinifera
kind: fruit
group: lozovi
summary: Десертното грозде узрява от юли до октомври според сорта. Най-много лозя с десертни сортове има в Пловдивско.
varieties:
  - name: Болгар
    note: Един от най-ценените десертни сортове у нас, известен и като Афуз Али.
  - name: Супер ран болгар
  - name: Плевен
    note: Български сорт с едри жълто-зелени зърна.
  - name: Кардинал
    note: С едри тъмновиолетови зърна и леко мискетов вкус.
  - name: Хамбургски мискет
    note: С тъмносини зърна и мискетов аромат.
