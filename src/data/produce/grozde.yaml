growing:
  sow: []
  transplant: []
  plant: [3, 4]
  plantingNote: 'Напролет засаждай през втората половина на март и в началото на април – колкото по-рано, толкова по-добре се прихващат лозите.'
  tips:
    - 'Засади лозата на слънчево място, защитено от студени северни ветрове; южните изложения помагат на късните сортове да узреят.'
    - 'Десертните сортове искат много топлина и се отглеждат до около 400 м надморска височина.'
    - 'Не засаждай в дни под 0 °C – корените на лозичките са чувствителни на студ.'
    - 'Накисни лозичките във вода за едно денонощие преди засаждането, за да се освежат.'
    - 'Купувай сертифицирани лозички от надежден разсадник и засади два-три сорта с различен срок на узряване.'
  sources:
    - name: 'Български фермер – Кои десертни сортове грозде си заслужава да засадим в двора?'
      url: https://www.bgfermer.bg/Article/23894249
    - name: 'Български фермер – Кога и как се засаждат лозите'
      url: https://www.bgfermer.bg/Article/11164624
    - name: 'Български фермер – Как да подготвите мястото за лозов масив'
      url: https://www.bgfermer.bg/Article/21333575
