name: Кисел трън
latinName: Berberis vulgaris
kind: fruit
group: kiselotranovi
summary: 'Киселият трън е бодлив храст с дребни жълти цветчета. Овалните му червени плодчета узряват през август и септември.'
wild: true
season:
  - { month: 8, level: peak }
  - { month: 9, level: peak }
cautions:
  - kind: protected
    text: 'По заповед на МОСВ за 2026 г. киселият трън се бере от природата само в определени количества и райони, а в националните паркове – не. Не важи за лични нужди: до 10 кг плодове на ден.'
    source:
      name: 'МОСВ – Заповед № РД-178 от 18 февруари 2026 г. (ДВ, бр. 24 от 2026 г.)'
      url: https://www.moew.government.bg/static/media/ups/tiny/filebase/Nature/Legislation/Zapovedi/MedicinalPlants/RD-178-18.02.2026-MedPlants.pdf
updatedAt: 2026-11-13
