growing:
  sow: [3, 4, 6, 7]
  transplant: [5, 6]
  plant: []
  plantingNote: 'Разсада сей в края на март; директно в лехата – от втората половина на април, а за късна реколта – от края на юни до началото на юли.'
  tips:
    - 'Разсаждай без покритие в началото на юни, когато през деня е 18–20 °C.'
    - 'При директна сеитба в редове остави 90–100 см между тях и прореди растенията на 25–30 см.'
    - 'Поливай обилно веднъж или два пъти седмично, сутрин, без да мокриш листата.'
    - 'Осигури опора от телове или мрежа, по която стъблата да се катерят над земята.'
