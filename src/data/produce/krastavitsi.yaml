preparation:
  - method: Сурови с кората
    tip: Измий ги добре и ги яж с кората; стойностите на USDA са за краставица с кора.
  - method: В салата или таратор
    tip: Нарязвай или настъргвай краставиците малко преди сервиране, за да останат хрупкави.
traditionalUses: []
howToChoose: Избери твърди, равномерно зелени краставици без пожълтели или меки краища.
storage: Пази краставиците в хладилника, в отделението за зеленчуци, и ги изяж до около седмица.
faq:
  - question: Защо има краставици и през пролетта?
    answer: Те идват основно от оранжерии. През 2025 г. около три четвърти от краставиците в България са от оранжерии по данни на МЗХ.
  - question: Кога се засаждат краставиците навън?
    answer: Под покритие – около 10–15 май, а без покритие – в началото на юни, когато опасността от слани е отминала.
