name: Черна боровинка
latinName: Vaccinium myrtillus
kind: fruit
group: pirenovi
summary: 'Дивата черна боровинка расте в светли гори между 1200 и 2200 м надморска височина. Цъфти през юни–юли и плодоноси през август.'
wild: true
season:
  - { month: 8, level: peak }
cautions:
  - kind: protected
    text: 'Черната боровинка е в списъка на Закона за лечебните растения: за лични нужди можеш да набереш до 10 кг плодове на ден, а за търговия ти трябва позволително.'
    source:
      name: 'Закон за лечебните растения (консолидиран текст до ДВ, бр. 58 от 2017 г.), копие във FAOLEX'
      url: https://faolex.fao.org/docs/pdf/bul40297.pdf
updatedAt: 2026-11-13
