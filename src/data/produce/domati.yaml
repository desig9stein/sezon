growing:
  sow: [2, 3]
  transplant: [4, 5]
  plant: []
  plantingNote: 'Ранните домати сей през февруари, средноранните – през първата половина на март; разсаждай от края на април и през целия май.'
  tips:
    - 'Засаждай, когато почвата на 10 см дълбочина се стопли до 14–15 °C и мине опасността от късни слани.'
    - 'Закаляй разсада около седмица навън и го засади почти на същата дълбочина, на която е бил в съда.'
    - 'Не сади домати след картофи, пипер или патладжан; добри предшественици са грах, фасул, тикви и зеле.'
    - 'Сложи опорните колчета още при засаждането, полей веднага, а следващата поливка направи след седмица.'
    - 'За високостъблени сортове остави 75–80 см между редовете и 35–40 см между растенията.'
