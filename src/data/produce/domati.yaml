preparation:
  - method: Сурови
    tip: Нарежи ги непосредствено преди ядене, за да запазят сока си и повече витамин C.
  - method: Задушени
    tip: Кратко задушаване губи по-малко водоразтворими витамини от дългото варене.
traditionalUses: []
howToChoose: Избери тежки за размера си домати с наситен цвят и гладка кора, без меки петна и пукнатини.
storage: Пази узрелите домати на стайна температура, далеч от пряко слънце, и ги изяж до няколко дни; в хладилника губят аромат.
faq:
  - question: Кога са доматите от открити площи?
    answer: От юли до септември. През пролетта доматите по пазарите идват основно от оранжерии.
  - question: Къде се отглеждат най-много домати в България?
    answer: В Южния централен район – 1 469 от 2 312 ха реколтирани открити площи с домати през 2025 г. по данни на МЗХ.
