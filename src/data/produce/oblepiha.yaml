name: Облепиха
latinName: Hippophae rhamnoides
kind: fruit
group: mirizlivovarbovi
summary: Облепихата узрява от края на юли до октомври според сорта. Плодовете са с къси дръжки и тънка кожица, затова се берат трудно.
