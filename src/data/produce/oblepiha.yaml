cautions:
  - kind: protected
    text: 'Облепихата е защитен вид: Законът за биологичното разнообразие забранява брането ѝ в естествените ѝ находища. Плодовете, които се продават, са от насаждения.'
    source:
      name: 'Закон за биологичното разнообразие (обн. ДВ, бр. 77 от 2002 г., посл. доп. ДВ, бр. 70 от 2024 г.), текст на МОСВ'
