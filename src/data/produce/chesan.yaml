  plant: [9, 10]
  plantingNote: 'Засаждай от септември до началото на ноември в най-топлите райони, преди първите слани.'
  tips:
    - 'За зелен чесън засаждай зимен чесън – растенията му са по-нежни.'
    - 'Избери открито, повдигнато и слънчево място – чесънът не понася застояла вода.'
    - 'Не засаждай чесън на едно и също място две години подред.'
    - 'Не тори с пресен или полуразложен оборски тор; угнилия тор внеси още при предшественика.'
    - 'Засаждай скилидките с дъното надолу, през 10–15 см в реда и 20–25 см между редовете.'
