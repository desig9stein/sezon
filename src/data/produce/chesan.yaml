name: Чесън
latinName: Allium sativum
kind: vegetable
group: amarilisovi
summary: Зеленият чесън идва напролет, а зрелите глави се прибират през лятото и се пазят до зимата. Чесънът има високо съдържание на манган.
varieties:
  - name: Юнак
  - name: Зимен 14
    note: Местен сорт от официалната сортова листа.
