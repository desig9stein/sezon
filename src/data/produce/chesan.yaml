preparation:
  - method: Зелен чесън
    tip: Яж го целия – и стръка, и младата главичка, нарязани в салата или в ястие накрая.
  - method: Суров
    tip: Добавяй скилидките сурови в салати и сосове, за да не губиш витамин C при готвене.
traditionalUses: []
howToChoose: Избери твърди и тежки глави със суха обвивка и без кълнове, а зеления чесън – със свежи, неувехнали стръкове.
storage: Зрелите глави пази на сухо, хладно и проветриво място; зеления чесън – в хладилник до седмица.
faq:
  - question: Каква е разликата между зелен и зрял чесън?
    answer: Зеленият чесън се бере напролет, докато е млад и с меки листа. Зрелият се прибира през лятото, когато главите са оформени.
  - question: За какъв чесън са хранителните стойности?
    answer: За суровите скилидки на зрелия чесън (USDA „Garlic, raw“). За зеления чесън няма отделен запис.
