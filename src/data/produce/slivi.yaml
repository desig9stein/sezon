  transplant: []
  plant: [3, 11, 12]
  plantingNote: 'Наесен засаждай от ноември до 15–20 декември, преди големите студове; напролет – в началото на март.'
  tips:
    - 'Сливата е сред най-издръжливите на силни мразове овошки и вирее до около 800 м надморска височина.'
    - 'Става и за по-хълмисти участъци – на склон с наклон 5–12°.'
    - 'Расте добре на слабокисела до неутрална почва.'
    - 'Стенлей и Чачанска лепотица се самоопрашват.'
