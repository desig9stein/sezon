preparation:
  - method: Пресни
    tip: Белият восъчен налеп по кората е естествен – измий го точно преди ядене.
  - method: Компот и мармалад
    tip: Сливите от сорта Стенлей стават на компот, мармалад и конфитюр, а се и сушат.
traditionalUses: []
howToChoose: Избери плътни сливи с восъчен налеп, които поддават съвсем леко при натиск.
storage: Твърдите сливи дозряват на стайна температура; узрелите пази в хладилник и ги изяж до няколко дни.
faq:
  - question: Кога е сезонът на сливите в България?
    answer: Ранните сортове узряват през юли, а Стенлей – в края на август и началото на септември.
