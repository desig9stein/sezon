name: Сливи
latinName: Prunus domestica
kind: fruit
group: rozotsvetni
summary: Сливите узряват от юли до септември. Ядат се пресни, сушат се и стават на компот, мармалад и конфитюр.
varieties:
  - name: Стенлей
    note: Американски сорт с голямо разпространение у нас, стандарт.
  - name: Чачанска лепотица
    note: Сръбски самоопрашващ се сорт.
  - name: Пловдивска ренклода
    note: Български сорт, получен от Стенлей.
