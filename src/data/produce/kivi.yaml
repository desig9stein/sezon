name: Киви
latinName: Actinidia deliciosa
kind: fruit
group: aktinidievi
summary: Кивито у нас узрява в края на октомври и през ноември, а плодовете стават готови за ядене през декември.
varieties:
  - name: Хейуърд
    note: 'Основният, най-едроплоден сорт; узрява в края на октомври и първите дни на ноември.'
  - name: Абот
    note: 'Узрява около 25 октомври.'
  - name: Бруно
    note: 'Узрява до 19–20 октомври.'
  - name: Монти
    note: 'Зрее обикновено около 25 октомври.'
