preparation:
  - method: Пресен
    tip: Измий кората, преди да разрежеш пъпеша, за да не пренесеш замърсяване от нея към месото.
  - method: Със солено
    tip: Сладкият пъпеш върви добре със сирене или сушено месо.
traditionalUses: []
howToChoose: Избери тежък за размера си пъпеш, който ухае сладко при дръжката и поддава леко при натиск в другия край.
storage: Цял пъпеш издържа няколко дни на стайна температура; нарязания пази покрит в хладилник и го изяж до два-три дни.
faq:
  - question: Как да разбера дали пъпешът е узрял?
    answer: Узрелият пъпеш има приятен плодов аромат и поддава леко при натиск.
  - question: Кога е сезонът на пъпешите в България?
    answer: Първите пъпеши от открити площи се берат през юли, а беритбата продължава до септември.
