growing:
  sow: [4, 5]
  transplant: []
  plant: []
  tips:
    - 'Сей, когато почвата на 10 см дълбочина се затопли до 14–15 °C – обикновено в края на април или началото на май.'
    - 'Сей гнездово по 3–4 семена на 4–5 см дълбочина, на 50–60 см в реда и на 120–150 см между редовете.'
    - 'Когато растенията имат 2–3 листа, прореди ги и остави по две във всяко гнездо.'
    - 'Поливай най-много по време на цъфтежа и наедряването; дъждовете по време на зреене намаляват захарите.'
    - 'Остави най-много по три плода на растение и бери, когато плодът ухае и леко омекне.'
