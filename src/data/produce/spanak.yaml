preparation:
  - method: Пресен в салата
    tip: Суровите листа запазват витамин C и фолата.
  - method: Бланширан
    tip: Бланширането за 1–2 минути намалява оксалатите.
traditionalUses: []
howToChoose: Изберете свежи, тъмнозелени и стегнати листа без пожълтяване и слуз.
storage: Неизмит спанак се пази в хладилник до четири дни в хартиен плик.
faq:
  - question: Кога е сезонът на спанака?
    answer: Има пролетен сезон (март–май) и есенен сезон (септември–ноември).
