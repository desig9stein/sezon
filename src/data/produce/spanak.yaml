  tips:
    - 'Сейте на слънчево място; спанакът понася полусянка, но там расте по-слабо.'
    - 'Подгответе плодородна почва с хумус или угнил оборски тор.'
    - 'Сейте в плитки бразди през 15 см и на етапи през 7–10 дни за по-дълга беритба.'
    - 'Поливайте 2–3 пъти седмично – спанакът страда силно от суша и жега.'
    - 'Берете, когато розетката има 8–10 листа, обикновено 40–50 дни след поникване.'
