preparation:
  - method: Сурови
    tip: Яжте ги с кората – там е голяма част от фибрите.
  - method: Задушени
    tip: Кратко задушени без захар са лек десерт, който запазва фибрите.
traditionalUses: []
howToChoose: Узрялата круша поддава леко при натиск около дръжката.
storage: Твърдите круши дозряват на стайна температура; узрелите се пазят в хладилник до пет дни.
faq:
  - question: Как да разбера дали крушата е узряла?
    answer: Натиснете леко около дръжката – ако поддава, крушата е готова за ядене.
