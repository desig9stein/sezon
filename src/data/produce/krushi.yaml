growing:
  sow: []
  transplant: []
  plant: [3, 10, 11, 12]
  plantingNote: 'Неустойчивите на студ сортове засаждай напролет; в северните райони – и фиданките от по-южни разсадници.'
  tips:
    - 'Крушата иска проветрива, плодородна почва, дълбока поне 1 м; избягвай засолени и преовлажнени места.'
    - 'Сортовете не се самоопрашват – засади поне два, които цъфтят по едно и също време.'
    - 'Изкопай ямка около 90 см широка и 40 см дълбока 3–4 седмици преди есенното засаждане.'
    - 'Поливай обилно през юли и август – крушата има нужда от много повече вода, отколкото дават валежите.'
    - 'Бери, когато кожицата започне да пожълтява, дръжката се отделя лесно и семките потъмнеят.'
