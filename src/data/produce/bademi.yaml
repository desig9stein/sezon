name: Бадеми
latinName: Prunus dulcis
kind: nut
group: rozotsvetni
summary: Бадемите узряват от края на август до втората половина на септември, а беритбата продължава и през октомври.
varieties:
  - name: Ароматичен
    note: 'Узрява към средата на септември.'
  - name: Аспарух
    note: 'Узрява в средата на септември.'
  - name: Марково
    note: 'Узрява в началото на септември.'
  - name: Никитски
    note: 'Узрява през първата половина на септември.'
  - name: Нонпарел
    note: 'Узрява в края на август и началото на септември.'
  - name: Поморие
    note: 'Узрява през втората половина на септември.'
