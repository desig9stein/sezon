preparation:
  - method: Пресни
    tip: Измий ги точно преди ядене – мокрите череши се развалят по-бързо.
  - method: В сладкиш
    tip: Махни костилките с вилица или машинка за костилки, преди да ги печеш.
traditionalUses: []
howToChoose: Избери твърди, лъскави череши със зелени, гъвкави дръжки.
storage: Пази ги неизмити в хладилник и ги изяж до няколко дни.
faq:
  - question: Кога е сезонът на черешите в България?
    answer: Ранните сортове узряват през май, основната беритба е през юни, а по-късните сортове продължават до юли.
