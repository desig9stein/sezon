name: Череши
latinName: Prunus avium
kind: fruit
group: rozotsvetni
summary: Черешите са сред първите летни плодове – берат се от май до юли. Най-много черешови градини има в Бургаско, Кюстендилско и Пловдивско.
varieties:
  - name: Бигаро Бюрла
    note: Френски сорт, у нас основен стандартен сорт.
  - name: Ван
    note: Канадски сорт, у нас основен стандартен сорт.
  - name: Косара
    note: Много ранен сорт, създаден в Института по овощарство в Пловдив.
  - name: Кордия
season:
