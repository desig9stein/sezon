growing:
  sow: []
  transplant: []
  plant: [3, 11, 12]
  plantingNote: 'Наесен засаждай от ноември до 15–20 декември, преди големите студове; напролет – в началото на март.'
  tips:
    - 'Черешата вирее до около 800 м надморска височина; на хълмист терен я засади на склон с наклон 5–12°.'
    - 'Може да расте и на слабо алкална почва; избягвай места с високи подпочвени води.'
    - 'По-малко мразоустойчива е от ябълката и сливата – избягвай ниски места, където се задържа студен въздух.'
    - 'Засади наблизо опрашител – Косара, например, се опрашва добре от Бигаро Бюрла и от самоплодните сортове.'
  sources:
