preparation:
  - method: Сурово
    tip: Нарежи розичките на тънко в салата – така не губиш витамин C при готвене.
  - method: На пара
    tip: Готви розичките на пара кратко, докато омекнат, вместо да ги вариш дълго във вода.
traditionalUses: []
howToChoose: Избери бяла или кремава, плътна и тежка глава със стегнати розички, без кафяви петна, и със свежи зелени листа.
storage: Пази го в хладилника, увит или в плик, и го изяж до няколко дни.
faq:
  - question: Кога е сезонът на карфиола в България?
    answer: Карфиолът се отглежда най-често като късна култура, защото главите му стават най-качествени наесен, когато е по-хладно.
  - question: Защо главата на карфиола е рехава?
    answer: При високи температури вътрешните листа прорастват и главата става по-рехава и лека.
