growing:
  sow: [5, 6, 7]
  transplant: [7, 8, 9]
  plant: []
  plantingNote: 'За есенна реколта сей разсада от края на май до края на юли и разсаждай около месец по-късно – до началото на септември.'
  tips:
    - 'Засади карфиола в леха след салати, лук или спанак – никога след друго зеле.'
    - 'Остави около 50 × 60 см между растенията или следвай указанието на пакетчето със семена.'
    - 'Поливай редовно, най-много докато се оформят главите, и след всяка поливка леко разрохквай почвата.'
    - 'Подхрани с азотен тор два пъти – преди първото окопаване и 20–25 дни след него.'
    - 'За да остане главата бяла, събери най-външните листа над нея и ги завържи.'
