name: Моркови
latinName: Daucus carota subsp. sativus
kind: vegetable
group: sennikotsvetni
summary: Морковите се берат от лятото до късна есен и се съхраняват през зимата. Богати са на бета-каротин, от който тялото прави витамин A.
