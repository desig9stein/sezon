preparation:
  - method: Задушени с мазнина
    tip: Бета-каротинът е мастноразтворим и се усвоява по-добре с малко зехтин или масло.
  - method: Сурови
    tip: Настърганите сурови моркови запазват витамин C и хрупкавостта си.
traditionalUses: []
howToChoose: Изберете твърди, гладки моркови с наситен оранжев цвят, без пукнатини.
storage: Махнете зелените части и пазете морковите в хладилник до три седмици.
faq:
  - question: Кое запазва повече хранителни вещества – варени или сурови моркови?
    answer: При готвене с малко мазнина бета-каротинът се усвоява по-добре, а суровите запазват повече витамин C.
