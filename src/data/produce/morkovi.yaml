name: Моркови
latinName: Daucus carota subsp. sativus
kind: vegetable
group: sennikotsvetni
summary: Морковите се берат от лятото до късна есен и се съхраняват през зимата. Имат високо съдържание на витамин A под формата на бета-каротин.
