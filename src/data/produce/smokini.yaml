  plant: []
  plantingNote: 'Засади смокинята рано наесен, докато е топло, или напролет, след като мине опасността от измръзване.'
  tips:
    - 'Избери топло южно изложение, защитено от студени ветрове.'
    - 'Смокинята расте най-добре на дълбока, пропусклива и топла почва; избягвай сухите, плитките, киселите и засолените почви.'
    - 'При есенно засаждане загърли дръвчето на 20–30 см над почвата, за да не измръзне.'
    - 'Където зимата е по-студена, оформи смокинята с няколко стъбла вместо като дърво с едно стъбло.'
    - 'Бери плодовете узрели – откъсната неузряла, смокинята не дозрява и остава безвкусна.'
  sources:
