preparation:
  - method: Пресни
    tip: Яж ги с кората, само отрежи дръжката.
  - method: Сушени
    tip: Сушените смокини се пазят месеци, но имат много повече захари на 100 г от пресните.
traditionalUses: []
howToChoose: Избери меки, но не смачкани смокини с цяла кора – неузрялата смокиня не дозрява след беритбата.
storage: Пази пресните смокини в хладилник и ги изяж до един-два дни.
faq:
  - question: Кога е сезонът на смокините в България?
    answer: Плодовете узряват от август до края на октомври, главно в топлите южни райони.
