  plant: []
  tips:
    - 'Избери открито, слънчево място – на сянка копърът расте по-слабо и губи аромата си.'
    - 'Сей на всеки 7–8 дни, за да имаш непрекъснато свеж копър.'
    - 'Поливай редовно през лятото – при жега и суша растенията бързо избиват на цвят.'
    - 'Сей до зеле и лук, но далеч от моркови и домати.'
    - 'Режи листата, когато растенията стигнат 10–12 см височина.'
