growing:
  sow: [2, 3, 7, 8, 10]
  transplant: []
  plant: []
  tips:
    - 'Избери слънчево място – копърът расте най-добре на слънце, а без достатъчно светлина листата пожълтяват.'
    - 'Прави няколко последователни сеитби през 3–4 седмици.'
    - 'Поливай по малко, но често – копърът обича влага, но на дренирана почва.'
    - 'Сей до зеле и лук, но далеч от моркови и домати.'
    - 'Режи копъра 20–30 дни след поникването, когато растенията стигнат 10–15 см.'
