name: Пипер
latinName: Capsicum annuum
kind: vegetable
group: kartofovi
summary: Пиперът от открити площи се бере от юли до октомври, най-много през август и септември. Зеленият пипер има високо съдържание на витамин C.
varieties:
  - name: Куртовска капия
  - name: Ивайловска капия
  - name: Сиврия 600
  - name: Стряма
