growing:
  sow: [2, 3]
  transplant: [5]
  plant: []
  tips:
    - 'Не бързай с изнасянето навън: в студено време растенията изостават. По-рано сади само под найлон.'
    - 'Остави поне 25 см между растенията и 60 см между редовете, за да не страдат от липса на светлина.'
    - 'Не заравяй кореновата шийка – сади разсада не по-дълбоко от първите семеделни листенца.'
    - 'Поливай често и по малко: и сушата, и преполиването карат цветовете и завръзите да окапват.'
    - 'Прекопавай плитко на всеки две седмици или мулчирай със слама, за да не нараниш плитките корени.'
