preparation:
  - method: Суров
    tip: Нарязан на салата запазва най-много витамин C, който намалява при нагряване.
  - method: Печен
    tip: Изпечи чушките цели, затвори ги за няколко минути в съд с капак и ще се обелят лесно.
traditionalUses: []
howToChoose: Избери твърди, лъскави чушки с гладка кора и свежа зелена дръжка, без бръчки и меки места.
storage: Пази чушките неизмити в хладилника до около седмица и ги измий точно преди употреба.
faq:
  - question: Кои сортове пипер са български?
    answer: В Официалната сортова листа има много български сортове, сред тях Куртовска капия, Ивайловска капия, Сиврия 600 и Стряма.
  - question: Колко витамин C има в зеления пипер?
    answer: Около 80 mg на 100 г, колкото е референтният дневен прием за възрастен.
