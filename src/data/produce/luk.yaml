preparation:
  - method: Суров
    tip: Нарежи го на салата малко преди да го сервираш, за да запази свежия си вкус и витамин C.
  - method: Задушен
    tip: Задушавай го на слаб огън с малко мазнина, докато омекне и стане сладък.
traditionalUses: []
howToChoose: Избери твърди глави със суха, шумоляща люспа, без кълнове, меки места и мухъл.
storage: Изсушен добре, лукът се пази на тъмно, сухо и проветриво място – сплетен на плитка или в мрежест чувал – до следващата пролет.
faq:
  - question: Кога се прибира лукът кромид?
    answer: Обикновено в края на юли и началото на август, когато луковиците спрат да растат, а стъблата омекнат и полегнат.
  - question: Колко дълго се пази лукът?
    answer: Ако е добре изсушен и стои на тъмно, сухо и проветриво място, лукът издържа до следващата пролет.
