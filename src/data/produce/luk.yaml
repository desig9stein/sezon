growing:
  sow: [3]
  transplant: []
  plant: [2, 3]
  plantingNote: 'Арпаджика засаждай от втората половина на февруари до средата на март; семената за арпаджик се сеят в началото на март.'
  tips:
    - 'Засаждай арпаджика на 5–6 см дълбочина, на 15–20 см между редовете и на 10 см в реда.'
    - 'За едри глави избери арпаджик с диаметър около 10 мм, но не повече от 15 мм.'
    - 'Лукът иска светлина и леки, песъчливо-глинести почви – не го сади между овощни дръвчета.'
    - 'Поливай напролет, ако е сухо, но не преполивай – излишната влага влошава луковиците и съхранението им.'
    - 'Прибери, когато стъблата омекнат и полегнат, и просуши лука на сянка под навес.'
  sources:
    - name: 'Български фермер – Как да си отгледате лук от арпаджик'
      url: https://www.bgfermer.bg/Article/10970651
