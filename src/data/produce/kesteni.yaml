name: Кестени
latinName: Castanea sativa
kind: nut
group: bukovi
summary: Ядливите кестени са на пазара основно от средата на септември до края на ноември. Печени или варени, те са вкусът на есента.
varieties:
  - name: Вольотика
    note: Гръцки сорт, засаден в кестенова градина край Сандански.
  - name: Морони
    note: Гръцки сорт, използван в същата градина като опрашител.
