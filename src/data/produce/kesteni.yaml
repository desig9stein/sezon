preparation:
  - method: Печени
    tip: Нарежи черупката на кръст преди печене, за да не се пръснат кестените, и ги обели, докато са топли.
  - method: Варени
    tip: Вари ги с нарязана черупка, докато омекнат, и ги обели топли – вътрешната ципа се маха по-лесно.
traditionalUses: []
howToChoose: Избери тежки, лъскави кестени с твърда черупка, без дупчици, пукнатини и мухъл.
storage: Пресните кестени пази в хладилника в хартиен плик и ги изяж скоро.
faq:
  - question: Ядливият кестен и конският кестен едно и също ли са?
    answer: Не, това са различни дървета. Плодовете на конския кестен не стават за храна – отровни са.
  - question: Защо някои кестени имат дупчица?
    answer: Ларвите на кестеновия хоботник се хранят с ядката и излизат от плода през кръгъл отвор. Такива кестени не купувай.
  - question: За какви кестени са хранителните стойности?
    answer: За сурови ядливи кестени без черупката, но с вътрешната ципа (запис на USDA). Ципата обикновено се маха, затова стойностите са ориентировъчни.
