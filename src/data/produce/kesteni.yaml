  plant: [9, 10, 11]
  plantingNote: 'Кестенът се засажда наесен – от края на септември до началото или средата на ноември, ако времето е топло.'
  tips:
    - 'Кестенът расте бавно: по-сериозно ражда на 5–6 година, а с пълна сила – след десетата.'
    - 'Купи здрав посадъчен материал: мастилената болест по кестена е гъбна и няма лечение.'
    - 'Събирай и унищожавай окапалите червиви плодове, за да ограничиш кестеновия хоботник.'
    - 'Събирай и унищожавай окапалите листа – по тях зимува гъбата, която причинява листни петна.'
