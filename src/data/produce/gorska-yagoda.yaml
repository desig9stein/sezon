name: Горска ягода
latinName: Fragaria vesca
kind: fruit
group: rozotsvetni
summary: 'Горската ягода расте масово в разсветлените гори, из храсталаци и сечища. Плодоноси от юни до септември.'
wild: true
season:
  - { month: 6, level: peak }
  - { month: 7, level: peak }
  - { month: 8, level: peak }
  - { month: 9, level: peak }
cautions:
  - kind: protected
    text: 'Горската ягода е в списъка на Закона за лечебните растения: за лични нужди можеш да набереш до 10 кг плодове на ден, а за търговия ти трябва позволително.'
    source:
      name: 'Закон за лечебните растения (консолидиран текст до ДВ, бр. 58 от 2017 г.), копие във FAOLEX'
