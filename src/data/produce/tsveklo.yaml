  plant: []
  tips:
    - 'Сейте в топла, слънчева леха с плодородна, рохкава почва без буци.'
    - 'Сейте в редове през 25–30 см, с 8–10 см между растенията; при гъст посев прореждайте.'
    - 'Накиснете семената в топла вода за 8–12 часа преди сеитбата.'
    - 'Поддържайте почвата умерено влажна и спрете поливането 10–15 дни преди изваждане.'
    - 'Добри предшественици са картофи, краставици, моркови и бобови; не внасяйте пресен оборски тор.'
