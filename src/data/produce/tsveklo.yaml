name: Цвекло
latinName: Beta vulgaris
kind: vegetable
group: shtirovi
summary: Червеното цвекло е в сезон от лятото до есента и се съхранява през зимата. Има високо съдържание на фолат и наситен сладък вкус.
varieties:
  - name: Бордо
  - name: Детройт
