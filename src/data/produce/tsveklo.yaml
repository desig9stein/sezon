preparation:
  - method: Печено цяло
    tip: Печете го с кората – така губи по-малко водоразтворими витамини, отколкото при варене.
  - method: Сурово настъргано
    tip: Сурово в салата запазва най-много фолат.
traditionalUses: []
howToChoose: Изберете твърди корени с гладка кожа; ако има листа, те трябва да са свежи.
storage: Отрежете листата и пазете корените в хладилник до три седмици.
faq:
  - question: Защо урината почервенява след цвекло?
    answer: Това е безвреден ефект от пигмента бетанин и се наблюдава при част от хората.
