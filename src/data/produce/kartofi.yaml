growing:
  sow: []
  transplant: []
  plant: [2, 3, 4, 5, 6, 7]
  plantingNote: 'Ранните картофи засаждай от края на февруари до средата на март, средноранните и късните – от средата на април до средата на май, а втората култура – от средата на юни до средата на юли.'
  tips:
    - 'Засаждай, когато почвата на 10–12 см се е затоплила до 7–8 °C; в студена и мокра почва клубените покълват по-бавно.'
    - 'Засаждай рътени клубени от 50–70 г на 7–8 см дълбочина, с кълновете нагоре.'
    - 'Остави 60–70 см между редовете и 25–35 см между клубените в реда.'
    - 'Окопай след поникването и пак след 2–3 седмици, като с второто окопаване загърлиш растенията.'
    - 'Не сади картофи дълго на едно място, нито след домати, пипер или патладжан – нападат ги едни и същи болести.'
  sources:
