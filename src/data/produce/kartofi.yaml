preparation:
  - method: С кората
    tip: Свари или изпечи картофите неочистени – кората пази част от витамин C и калия.
  - method: На пара
    tip: Готвенето на пара губи по-малко водоразтворими витамини от варенето в много вода.
  - method: Печени
    tip: Пеки ги цели или на едри парчета, за да остане по-малка повърхност за загуби.
traditionalUses: []
howToChoose: Избери твърди, гладки картофи без кълнове, зелени петна и меки места.
storage: Пази ги на тъмно при 2–5 °C, в мрежест чувал или касетка, а не направо на пода. Наранените картофи изяж първи.
faq:
  - question: Кога е сезонът на картофите в България?
    answer: Ранните картофи се появяват през юни, а късните се вадят от август до октомври. През зимата се продават от хранилищата.
  - question: Защо картофите стават сладникави през зимата?
    answer: Ако се съхраняват при 0–2 °C, клубените се осладяват. Под 0 °C измръзват, затова ги дръж при 3–5 °C.
