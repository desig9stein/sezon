name: Ябълки
latinName: Malus domestica
kind: fruit
group: rozotsvetni
summary: Българските ябълки са в разгара си през септември и октомври, а сортовете за зимуване се съхраняват до пролетта.
varieties:
  - name: Айдаред
  - name: Златна превъзходна
  - name: Флорина
  - name: Ранет
    note: Стар сорт, подходящ за печене и компоти.
