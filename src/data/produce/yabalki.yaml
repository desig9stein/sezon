preparation:
  - method: Сурови с кората
    tip: Голяма част от фибрите и полифенолите са в кората – измийте добре и не я белете.
  - method: Печени
    tip: Печенето запазва фибрите, но намалява витамин C.
traditionalUses: []
howToChoose: Плодът трябва да е твърд, без меки места и с приятен аромат при дръжката.
storage: В хладилник ябълките остават свежи няколко седмици; дръжте ги отделно от другите плодове.
faq:
  - question: Кога е сезонът на ябълките?
    answer: Беритбата е от август до октомври, а складираните ябълки се предлагат до пролетта.
