growing:
  sow: []
  transplant: []
  plant: [3, 10, 11, 12]
  plantingNote: 'В студените северни райони неустойчивите на студ сортове е по-добре да се засаждат напролет.'
  tips:
    - 'Избери дълбока (поне 1 м), плодородна и проветрива почва, която задържа влага.'
    - 'Не засаждай в суха, замръзнала или подгизнала почва; след засаждане полей с около 20 л вода.'
    - 'Засади поне два сорта с едновременен цъфтеж – ябълковите сортове не се самоопрашват.'
    - 'Подреждай дръвчетата в редове север–юг, за да се огрява добре короната.'
    - 'Късните сортове се берат в началото на октомври и се съхраняват на хладно при 0–5 °C.'
