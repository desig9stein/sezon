preparation:
  - method: Сварен или задушен
    tip: Готви го кратко, докато омекне, но остане ярко зелен; при дълго варене се губят повече водоразтворими витамини.
  - method: Замразен
    tip: Късната реколта е подходяща за замразяване или за буркани за зимата.
traditionalUses: []
howToChoose: Избери твърди, ярко зелени чушки, които се чупят с хрупкане, без петна и без издути семена.
storage: Пази го в хладилника и го сготви до няколко дни; за зимата го замрази.
faq:
  - question: Кога се бере зеленият фасул?
    answer: Пролетно засетият се бере през юни, преди чушките да достигнат пълния си размер. Засетият като втора култура до около 20 юли е готов за по-малко от два месеца.
  - question: Какво е лико?
    answer: Жилава тъкан, която се образува в чушките заедно с пергаментов слой, когато фасулът се бере късно. Тогава качеството му се влошава.
