growing:
  sow: [4, 5, 7]
  transplant: []
  plant: []
  plantingNote: 'В Южна България сей през първото десетдневие на април, в Северна – през втората половина на месеца, във високите полета – в началото на май; като втора култура – до около 20 юли.'
  tips:
    - 'Сей, когато почвата на 10 см дълбочина се стопли до 10–12 °C; избягвай тежки, студени и кисели почви.'
    - 'Сей в гнезда по 4–5 семена на 5–6 см дълбочина.'
    - 'Ниските сортове сей на 50–60 см между редовете и 30 см между гнездата, вейковите – на 80 и 40 см.'
    - 'Сей на няколко пъти през няколко дни, за да е по-дълъг периодът на беритба.'
    - 'Бери чушките, преди да достигнат пълния си размер; при закъснение в тях се образува лико.'
