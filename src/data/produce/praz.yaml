  tips:
    - 'Празът иска плодородна почва, наторена с минерални и органични торове.'
    - 'Сей на редове през около 15 см: част от растенията остават на място, а другите се разсаждат.'
    - 'Семената на праза поникват много бавно.'
    - 'Плеви и поливай младите растения редовно: плевелите им отнемат вода, храна и светлина.'
