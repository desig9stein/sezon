preparation:
  - method: Печена
    tip: Печете с малко мазнина – бета-каротинът се усвоява по-добре с мазнини.
  - method: Крем супа
    tip: Варете кратко и пасирайте с бульона, за да не губите минералите.
traditionalUses: []
howToChoose: Изберете тежка тиква с твърда кора без пукнатини и с изсъхнала дръжка.
storage: Цяла тиква издържа месеци на хладно и сухо място; нарязаната се пази в хладилник до пет дни.
faq:
  - question: Колко дълго се съхранява тиквата?
    answer: Цяла и неповредена тиква издържа от два до шест месеца на хладно и сухо място.
