  plantingNote: 'Сее се направо на постоянно място, когато почвата трайно се затопли над 12–14 °C.'
  tips:
    - 'Тиквата е топлолюбива – сейте в затоплена почва; семената никнат при над 15 °C.'
    - 'Сейте семената направо на постоянно място, по 2–3 в гнездо на 5–6 см дълбочина.'
    - 'Оставете много място: около 3 × 2 м за едроплодните и 2,5 × 1 м за дребноплодните сортове.'
    - 'Наторете обилно с угнил оборски тор; една-две поливки увеличават чувствително реколтата.'
    - 'Подложете зреещите плодове на дъска или стиропор и намалете поливането, когато започнат да променят цвета си.'
