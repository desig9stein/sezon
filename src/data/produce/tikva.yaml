name: Тиква
latinName: Cucurbita spp.
kind: vegetable
group: tikvovi
summary: Тиквата е символ на есента. Има високо съдържание на витамин A, съхранява се месеци наред и е основа на баницата тиквеник.
varieties:
  - name: Цигулка
    note: Удължена форма, сладка и подходяща за печене.
  - name: Хокайдо
