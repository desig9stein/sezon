name: Броколи
latinName: Brassica oleracea var. italica
kind: vegetable
group: krastotsvetni
summary: У нас броколите са късна есенна култура и се берат през октомври. Имат високо съдържание на витамин C и витамин K.
varieties:
  - name: ИЗК Искра
    note: Първият български сорт броколи, предназначен за късно полско производство.
season:
  - { month: 9, level: available }
  - { month: 10, level: peak }
  - { month: 11, level: available }
