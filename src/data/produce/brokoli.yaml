preparation:
  - method: На пара
    tip: Няколко минути на пара запазват повече витамин C, отколкото варенето във вода.
  - method: Бланширани
    tip: Бланширай розичките за кратко във вряла вода и ги охлади, за да останат яркозелени и хрупкави.
traditionalUses: []
howToChoose: Избери плътна, тъмнозелена глава със стегнати пъпки, без жълти цветчета и меко стъбло.
storage: Броколите не се съхраняват дълго – изяж ги до няколко дни. Нарязани на розички, може да ги замразиш.
faq:
  - question: Кога е сезонът на броколите в България?
    answer: У нас броколите се отглеждат като късна култура – засаждат се в края на юли, а главите се берат през есента.
  - question: Защо броколите пожълтяват?
    answer: Пъпките на главата започват да цъфтят няколко дни след прибирането. Затова е добре броколите да се изядат скоро.
