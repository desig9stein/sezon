growing:
  sow: [6]
  transplant: [7]
  plant: []
  plantingNote: 'Сей разсада през първата половина на юни и разсаждай след 35–40 дни, към края на юли.'
  tips:
    - 'Разсаждай, когато растенията имат 5–6 листа, на дълбочина до първия лист.'
    - 'Остави 65–70 см между браздите и 35–40 см между растенията в реда.'
    - 'Полей веднага след разсаждането и пак след 4–5 дни, за да се прихванат растенията.'
    - 'През август растенията растат усилено – поливай редовно и дръж почвата рохкава и влажна.'
    - 'Главите се развиват най-добре при 16–24 °C; над 25 °C растенията прорастват и цъфтят.'
  sources:
    - name: 'Български фермер – Как се отглеждат броколи'
      url: https://www.bgfermer.bg/Article/968291
    - name: 'Български фермер – Броколито е късен зеленчук, не е трудно за отглеждане'
