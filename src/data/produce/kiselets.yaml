preparation:
  - method: Пресен в салата
    tip: Нарязвай листата непосредствено преди ястието – суровите листа запазват витамин C.
  - method: В супа или чорба
    tip: Добави го в последните минути, за да не губи цвета си и витамин C при дълго варене.
traditionalUses: []
howToChoose: Избери млади, сочни и яркозелени листа без жълти петна и увяхване.
storage: Неизмит киселец се пази в хладилник в хартиен плик до три дни.
faq:
  - question: Кога е сезонът на киселеца?
    answer: Най-нежните листа са през април и май. В градината можеш да береш листа и през лятото.
  - question: За какъв киселец са хранителните стойности?
    answer: За суровите листа от рода Rumex по USDA (запис „Dock, raw“), към който спада и киселецът.
