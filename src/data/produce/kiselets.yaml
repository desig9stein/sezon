  plant: [10]
  plantingNote: 'Наесен размножавай киселеца, като разделиш туфите; семената сей напролет.'
  tips:
    - 'Раздели туфа с добре оформени коренчета и засади стръкчетата със садило, после притъпкай и полей.'
    - 'Киселецът не е взискателен – засади го и там, където другите култури не виреят.'
    - 'Сей в редове през 25 см, а след поникването прореди растенията на 20 см едно от друго.'
    - 'Можеш да сееш и през лятото, но лехата трябва да е влажна.'
    - 'Бери листа почти през цялото лято и есен.'
