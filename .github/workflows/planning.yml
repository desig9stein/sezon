name: Planning

on:
  push:
    branches: [main]
    paths:
      - '.github/planning.yml'
      - '.github/workflows/planning.yml'
      - 'scripts/planning/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planning
  cancel-in-progress: false

jobs:
  sync:
    name: Sync planning to the project
    # The PROJECT_TOKEN secret is only used for the reviewed plan on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Convert the plan to JSON
        run: yq -o=json '.' .github/planning.yml > "$RUNNER_TEMP/plan.json"
      - name: Apply the plan
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: node scripts/planning/sync.ts "$RUNNER_TEMP/plan.json"
