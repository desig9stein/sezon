name: Feature
description: A new page, component or capability for the site.
title: 'feat: '
labels: ['type:feature']
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should be built and why? Who benefits?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable outcomes, ideally Given/When/Then. They become the spec's acceptance criteria.
      placeholder: |
        - Given … when … then …
    validations:
      required: true
  - type: textarea
    id: a11y-seo
    attributes:
      label: Accessibility and SEO notes
      description: Anything specific about keyboard use, screen readers, headings, structured data or URLs.
  - type: dropdown
    id: phase
    attributes:
      label: Roadmap phase
      options:
        - Phase 2 – Catalog
        - Phase 3 – Regions and farms
        - Phase 4 – Monetization
        - Phase 5 – Growth
        - Not on the roadmap
    validations:
      required: true
