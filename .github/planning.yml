# Planning metadata for every open issue. Applied to the user-owned Planing project and to the
# repository milestones by .github/workflows/planning.yml (spec 008). Closed issues are skipped.
# Estimates are in ideal days; epics sum their parts.
project:
  owner: desig9stein
  title: Planing

milestones:
  - title: 'Launch'
    due: '2026-12-17'
    description: Deploy, domain, board and repository setup
  - title: 'Phase 2 – visual identity and catalog'
    due: '2026-12-31'
    description: Redesign, catalog pages, search and about 40 produce
  - title: 'Phase 3 – regions and farms'
    due: '2027-01-29'
    description: Province map, region and farm pages, real farms
  - title: 'Phase 4 – non-intrusive monetization'
    due: '2027-02-26'
    description: Sponsors, ad slots, consent and legal pages
  - title: 'Phase 5 – growth'
    due: '2027-03-15'
    description: Open Graph images, RSS, newsletter and CMS

